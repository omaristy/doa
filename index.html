<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<title>Titip Doa Umroh</title>
<link rel="icon" href="icon.svg">
<style>
:root{--g:#0f3d2e;--g2:#1b6b4f;--gold:#d4af37;--cream:#fbf6e9;--ink:#1d2b25;--err:#b3261e}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,var(--g) 0,var(--g2) 220px,var(--cream) 220px);min-height:100vh;color:var(--ink);padding:0 0 40px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{color:#fff;text-align:center;padding:28px 8px 22px}
header .ar{font-size:26px;color:var(--gold);margin-bottom:6px;font-family:"Amiri","Traditional Arabic",serif}
header h1{font-size:24px;margin-bottom:8px}
header p{font-size:14px;line-height:1.5;opacity:.92}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(15,61,46,.18)}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:14px}
label:first-child{margin-top:0}
input[type=text],textarea{width:100%;font:inherit;padding:12px 14px;border:1.5px solid #d6dcd8;border-radius:12px;background:#fcfdfc;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(27,107,79,.15)}
textarea{min-height:130px;resize:vertical;line-height:1.5}
.count{text-align:right;font-size:12px;color:#7a8680;margin-top:4px}
.photo-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border:1.5px dashed var(--g2);border-radius:12px;background:#f3f8f5;color:var(--g);font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.pbtn:active{background:#e3f0e9}
.pbtn svg{width:26px;height:26px}
.hint{font-size:12px;color:#7a8680;margin-top:6px}
.preview{display:none;position:relative;margin-top:12px}
.preview img{width:100%;max-height:340px;object-fit:cover;border-radius:12px;display:block}
.preview button{position:absolute;top:8px;right:8px;border:0;background:rgba(0,0,0,.65);color:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.submit{width:100%;margin-top:20px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.submit:disabled{opacity:.6}
.err{color:var(--err);font-size:14px;margin-top:12px;display:none;text-align:center}
.done{display:none;text-align:center;padding:30px 10px}
.done .check{width:72px;height:72px;border-radius:50%;background:#e3f0e9;color:var(--g2);display:grid;place-items:center;margin:0 auto 16px;font-size:38px}
.done h2{margin-bottom:8px;color:var(--g)}
.done p{line-height:1.6;color:#44524b}
.link{margin-top:18px;background:none;border:1.5px solid var(--g2);color:var(--g2);padding:10px 18px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ar">بسم الله الرحمن الرحيم</div>
    <h1>Titip Doa Umroh</h1>
    <p id="intro">Silakan tuliskan nama dan doa Anda. Insya Allah akan dibacakan di Tanah Suci.</p>
  </header>

  <div class="card">
    <form id="form" novalidate>
      <label for="nama">Nama lengkap</label>
      <input type="text" id="nama" maxlength="100" placeholder="Contoh: Ahmad Fulan bin Abdullah" autocomplete="name">

      <label for="doa">Doa yang dititipkan</label>
      <textarea id="doa" maxlength="2000" placeholder="Tuliskan doa dan hajat Anda di sini…"></textarea>
      <div class="count"><span id="cnt">0</span>/2000</div>

      <label>Foto <span style="font-weight:400;color:#7a8680">(opsional)</span></label>
      <div class="photo-btns">
        <button type="button" class="pbtn" id="btnCam">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          Ambil dari Kamera
        </button>
        <button type="button" class="pbtn" id="btnGal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          Pilih dari Galeri
        </button>
      </div>
      <input type="file" id="inCam" accept="image/*" capture="user" hidden>
      <input type="file" id="inGal" accept="image/*" hidden>
      <div class="preview" id="prev"><img id="prevImg" alt="Pratinjau foto"><button type="button" id="rmPhoto">Hapus</button></div>
      <div class="hint">Foto otomatis dikecilkan agar cepat terkirim.</div>

      <div class="err" id="err"></div>
      <button class="submit" id="btnSend" type="submit">Kirim Titipan Doa</button>
    </form>

    <div class="done" id="done">
      <div class="check">✓</div>
      <h2>Jazakumullahu khairan</h2>
      <p>Titipan doa Anda sudah terkirim.<br>Semoga Allah mengabulkan hajat dan doa Anda. Aamiin.</p>
      <button class="link" id="again">Kirim titipan lagi</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
const $ = (s) => document.querySelector(s);
let fotoData = '';

if (CONFIG.NAMA_JAMAAH) {
  $('#intro').textContent = 'Titipkan nama dan doa Anda untuk ' + CONFIG.NAMA_JAMAAH + '. Insya Allah akan dibacakan di Tanah Suci.';
}

$('#doa').addEventListener('input', (e) => { $('#cnt').textContent = e.target.value.length; });
$('#btnCam').onclick = () => $('#inCam').click();
$('#btnGal').onclick = () => $('#inGal').click();
$('#inCam').onchange = (e) => pick(e.target.files[0]);
$('#inGal').onchange = (e) => pick(e.target.files[0]);
$('#rmPhoto').onclick = clearPhoto;

function clearPhoto() {
  fotoData = '';
  $('#inCam').value = ''; $('#inGal').value = '';
  $('#prev').style.display = 'none';
}

async function pick(file) {
  if (!file) return;
  try {
    fotoData = await compress(file, 1280, 0.75);
    $('#prevImg').src = fotoData;
    $('#prev').style.display = 'block';
  } catch (e) {
    clearPhoto();
    showErr('Foto tidak bisa dibaca. Coba pilih foto lain.');
  }
}

async function compress(file, max, q) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (_) {
    bmp = await new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img); img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
  }
  const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
  const k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}

function showErr(m) { const e = $('#err'); e.textContent = m; e.style.display = m ? 'block' : 'none'; }

$('#form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  showErr('');
  const nama = $('#nama').value.trim(), doa = $('#doa').value.trim();
  if (!nama) return showErr('Nama lengkap wajib diisi.');
  if (!doa) return showErr('Doa wajib diisi.');
  if (!CONFIG.SCRIPT_URL || CONFIG.SCRIPT_URL.indexOf('PASTE_') === 0) return showErr('Aplikasi belum dikonfigurasi (SCRIPT_URL di config.js).');
  const btn = $('#btnSend');
  btn.disabled = true; btn.textContent = 'Mengirim…';
  try {
    const res = await fetch(CONFIG.SCRIPT_URL, { method: 'POST', body: JSON.stringify({ nama, doa, foto: fotoData }) });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'Gagal');
    $('#form').style.display = 'none';
    $('#done').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    showErr('Gagal mengirim. Periksa koneksi internet lalu coba lagi.');
  } finally {
    btn.disabled = false; btn.textContent = 'Kirim Titipan Doa';
  }
});

$('#again').onclick = () => {
  $('#form').reset(); $('#cnt').textContent = '0'; clearPhoto();
  $('#done').style.display = 'none'; $('#form').style.display = 'block';
};
</script>
</body>
</html>
