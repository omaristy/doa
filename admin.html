<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<meta name="robots" content="noindex">
<title>Admin – Titipan Doa</title>
<link rel="manifest" href="manifest-admin.json">
<link rel="icon" href="icon.svg">
<style>
:root{--g:#0f3d2e;--g2:#1b6b4f;--gold:#d4af37;--cream:#fbf6e9;--ink:#1d2b25}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#0f3d2e,#08241b);color:#fff;display:flex;flex-direction:column;overflow:hidden}

/* bar atas */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));font-size:12px}
.status{display:flex;align-items:center;gap:7px;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:#9aa;flex:none}
.dot.on{background:#4cd964}.dot.off{background:#ff9f0a}.dot.sync{background:#5ac8fa;animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.tools{display:flex;gap:6px;flex:none}
.ib{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 11px;font:inherit;font-size:15px;cursor:pointer;line-height:1}
.ib:active{background:rgba(255,255,255,.28)}

/* area slide: kartu krem, teks gelap = kontras tinggi */
.stage{flex:1;min-height:0;padding:4px 12px 8px;display:flex}
.card{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--cream);color:var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 12px 36px rgba(0,0,0,.4);animation:in .3s ease}
@keyframes in{from{opacity:.0;transform:translateX(var(--dx,14px))}to{opacity:1;transform:none}}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 22px}
/* foto kecil (thumbnail bulat) di samping nama; ketuk untuk memperbesar */
.hd{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.ph{flex:none;width:76px;height:76px;border-radius:50%;overflow:hidden;background:#e6efe9;border:3px solid var(--gold);cursor:zoom-in;display:grid;place-items:center}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.ph.none{display:none}
.ph .ld{font-size:11px;color:#5b6a63;text-align:center;padding:4px;line-height:1.2}
.id{min-width:0}
.nm{font-weight:800;font-size:clamp(20px,5.6vw,30px);line-height:1.2;color:var(--g);overflow-wrap:anywhere}
.dt{font-size:13px;color:#5b6a63;margin-top:3px}
.sep{height:3px;width:56px;background:var(--gold);border-radius:3px;margin:4px 0 14px}
.doa{line-height:1.65;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;font-size:var(--fs,26px);color:#101a15;font-weight:500}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.zoom img{max-width:100%;max-height:100%;border-radius:12px}

.empty,.login{margin:auto;text-align:center;max-width:380px;line-height:1.6;padding:10px}
.login{background:rgba(255,255,255,.1);padding:24px;border-radius:18px;width:100%}
.login input{width:100%;font:inherit;padding:13px;border-radius:10px;border:0;margin:14px 0 10px;text-align:center;color:#000}
.login .ib{width:100%;background:var(--gold);color:#2a2000;font-weight:700;padding:13px}
.msg{color:#ffb4a8;font-size:13px;margin-top:10px;min-height:16px}

/* navigasi manual – tombol besar untuk jempol */
.bottom{padding:6px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.nav{border:0;border-radius:16px;padding:16px 8px;font:inherit;font-size:17px;font-weight:700;background:var(--gold);color:#2a2000;cursor:pointer}
.nav:active{filter:brightness(.9)}
.nav:disabled{opacity:.35}
.cn{text-align:center;font-size:15px;min-width:76px;opacity:.9}

/* layar lebar (laptop/tablet): foto kiri, teks kanan */
@media(min-width:800px){
  .scroll{padding:30px 44px}
  .ph{width:96px;height:96px}
  .doa{font-size:calc(var(--fs,26px) + 6px)}
  .stage,.bottom{max-width:900px;margin:0 auto;width:100%}
}
</style>
</head>
<body>

<div class="top">
  <div class="status"><i class="dot" id="dot"></i><span id="stxt">Memuat…</span></div>
  <div class="tools">
    <button class="ib" id="btnSync" title="Perbarui data">⟳</button>
    <button class="ib" id="btnFs" title="Layar penuh">⛶</button>
    <button class="ib" id="btnOut" title="Keluar / ganti password">⎋</button>
  </div>
</div>

<div class="stage" id="stage"></div>
<div class="zoom" id="zoom" onclick="this.style.display='none'"><img id="zimg" alt=""></div>

<div class="bottom">
  <button class="nav" id="prev">◀ Sebelumnya</button>
  <span class="cn" id="cn">–</span>
  <button class="nav" id="next">Berikutnya ▶</button>
</div>

<script src="config.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const LS_KEY = 'doa_admin_key', LS_SYNC = 'doa_last_sync', LS_POS = 'doa_pos';
let items = [], idx = 0, syncing = false, photoMem = {}, seq = 0, dir = 1;

/* ---------- IndexedDB (penyimpanan offline) ---------- */
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open('titipan-doa', 1);
  r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('photos'); };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function dbGet(store, key) {
  const db = await dbp;
  return new Promise((res, rej) => { const q = db.transaction(store).objectStore(store).get(key); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function dbPut(store, key, val) {
  const db = await dbp;
  return new Promise((res, rej) => { const t = db.transaction(store, 'readwrite'); t.objectStore(store).put(val, key); t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function dbKeys(store) {
  const db = await dbp;
  return new Promise((res, rej) => { const q = db.transaction(store).objectStore(store).getAllKeys(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}

/* ---------- Status ---------- */
function setStatus(kind, text) { $('#dot').className = 'dot ' + kind; $('#stxt').textContent = text; }
function fmtTime(ts) { return ts ? new Date(+ts).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '-'; }
function idleStatus() {
  const last = localStorage.getItem(LS_SYNC);
  if (navigator.onLine) setStatus('on', 'Online · diperbarui ' + fmtTime(last));
  else setStatus('off', 'Offline · data terakhir ' + fmtTime(last));
}

/* ---------- Sinkronisasi ---------- */
async function api(params) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await fetch(CONFIG.SCRIPT_URL + '?' + new URLSearchParams(params), { signal: ctl.signal });
    return await r.json();
  } finally { clearTimeout(t); }
}

async function sync() {
  const key = localStorage.getItem(LS_KEY);
  if (!key || syncing) return;
  if (!navigator.onLine) { idleStatus(); return; }
  if (!CONFIG.SCRIPT_URL || CONFIG.SCRIPT_URL.indexOf('PASTE_') === 0) { setStatus('off', 'SCRIPT_URL belum diisi di config.js'); return; }
  syncing = true; setStatus('sync', 'Menyinkronkan data…');
  try {
    const j = await api({ action: 'list', key });
    if (!j.ok) {
      if (j.error === 'unauthorized') { localStorage.removeItem(LS_KEY); showLogin('Password salah.'); }
      throw new Error(j.error);
    }
    const curId = items[idx] && items[idx].id;
    items = j.items.slice().reverse(); // terbaru dulu
    await dbPut('kv', 'items', items);
    localStorage.setItem(LS_SYNC, Date.now());
    const ni = items.findIndex((x) => x.id === curId);
    idx = ni >= 0 ? ni : Math.min(idx, Math.max(0, items.length - 1));
    render(true);
    await downloadPhotos(key);
    idleStatus();
  } catch (e) {
    setStatus('off', navigator.onLine ? 'Gagal sinkron · memakai data tersimpan' : 'Offline · data terakhir ' + fmtTime(localStorage.getItem(LS_SYNC)));
  } finally { syncing = false; }
}

async function downloadPhotos(key) {
  const have = new Set(await dbKeys('photos'));
  const need = items.filter((x) => x.foto && !have.has(x.foto));
  let done = 0;
  for (const it of need) {
    setStatus('sync', 'Mengunduh foto ' + (++done) + '/' + need.length + '…');
    try {
      const j = await api({ action: 'photo', id: it.foto, key });
      if (j.ok) {
        await dbPut('photos', it.foto, j.data);
        photoMem[it.foto] = j.data;
        if (items[idx] && items[idx].foto === it.foto) render(true);
      }
    } catch (e) { if (!navigator.onLine) break; }
  }
}

/* ---------- Tampilan slide ---------- */
async function getPhoto(id) {
  if (!id) return null;
  if (photoMem[id]) return photoMem[id];
  const d = await dbGet('photos', id);
  if (d) photoMem[id] = d;
  return d || null;
}

async function render(noAnim) {
  const stage = $('#stage');
  if (!items.length) {
    stage.innerHTML = '<div class="empty"><h2>Belum ada titipan doa</h2><p style="opacity:.75;margin-top:8px">Bagikan link form agar teman &amp; keluarga bisa mengirim doa, lalu tekan ⟳.</p></div>';
    $('#cn').textContent = '0 / 0'; $('#prev').disabled = $('#next').disabled = true; return;
  }
  if (idx >= items.length) idx = 0; if (idx < 0) idx = items.length - 1;
  const my = ++seq;
  const it = items[idx];
  const photo = await getPhoto(it.foto);
  if (my !== seq) return;

  // ukuran huruf menyesuaikan panjang doa (HP: tetap besar & jelas)
  const len = it.doa.length;
  const fs = len < 80 ? 32 : len < 180 ? 28 : len < 350 ? 25 : len < 600 ? 22 : len < 1000 ? 20 : 18;

  const card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--dx', (dir > 0 ? 16 : -16) + 'px');
  if (noAnim) card.style.animation = 'none';
  const sc = document.createElement('div'); sc.className = 'scroll';

  const ph = document.createElement('div');
  ph.className = 'ph' + (it.foto ? '' : ' none');
  if (photo) {
    const im = document.createElement('img'); im.src = photo; im.alt = ''; ph.appendChild(im);
    ph.onclick = () => { $('#zimg').src = photo; $('#zoom').style.display = 'flex'; };
  } else if (it.foto) { const l = document.createElement('div'); l.className = 'ld'; l.textContent = 'Foto belum ada'; ph.appendChild(l); }

  const tx = document.createElement('div'); tx.className = 'id';
  const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = it.nama;
  const dt = document.createElement('div'); dt.className = 'dt';
  dt.textContent = it.waktu ? new Date(it.waktu).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
  const sep = document.createElement('div'); sep.className = 'sep';
  const doa = document.createElement('div'); doa.className = 'doa'; doa.textContent = it.doa;
  doa.style.setProperty('--fs', fs + 'px');
  tx.append(nm, dt);
  const hd = document.createElement('div'); hd.className = 'hd'; hd.append(ph, tx);

  sc.append(hd, sep, doa); card.appendChild(sc);
  stage.replaceChildren(card);
  $('#cn').textContent = (idx + 1) + ' / ' + items.length;
  $('#prev').disabled = $('#next').disabled = items.length < 2;
  try { localStorage.setItem(LS_POS, it.id); } catch (_) {}
}

function go(d) { if (!items.length) return; dir = d; idx = (idx + d + items.length) % items.length; render(); }

/* ---------- Login ---------- */
function showLogin(msg) {
  $('#stage').innerHTML = '<div class="login"><h2>Admin Titipan Doa</h2><input type="password" id="pw" placeholder="Password admin" autocomplete="current-password"><button class="ib" id="go">Masuk</button><div class="msg" id="lm"></div></div>';
  $('#lm').textContent = msg || '';
  $('#go').onclick = async () => {
    const v = $('#pw').value.trim(); if (!v) return;
    if (!navigator.onLine) { $('#lm').textContent = 'Perlu internet untuk masuk pertama kali.'; return; }
    localStorage.setItem(LS_KEY, v);
    await sync();
    if (localStorage.getItem(LS_KEY) && !items.length) render();
  };
  $('#pw').addEventListener('keydown', (e) => e.key === 'Enter' && $('#go').click());
}

/* ---------- Kontrol (manual) ---------- */
$('#prev').onclick = () => go(-1);
$('#next').onclick = () => go(1);
$('#btnSync').onclick = () => sync();
$('#btnFs').onclick = () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); };
$('#btnOut').onclick = () => { if (confirm('Keluar? Data offline tetap tersimpan di perangkat ini.')) { localStorage.removeItem(LS_KEY); showLogin(); } };
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'f' || e.key === 'F') $('#btnFs').click();
});
// geser kiri/kanan (hanya jika gerakan dominan horizontal, agar scroll teks tidak terganggu)
let sx = 0, sy = 0;
$('#stage').addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$('#stage').addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
});
window.addEventListener('online', () => sync());
window.addEventListener('offline', idleStatus);
setInterval(() => sync(), 5 * 60 * 1000);

/* ---------- Mulai ---------- */
(async function init() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  const cached = await dbGet('kv', 'items');
  if (cached && cached.length) {
    items = cached;
    const pos = localStorage.getItem(LS_POS);
    const pi = items.findIndex((x) => x.id === pos);
    if (pi >= 0) idx = pi;
    idleStatus(); render(true);
  }
  if (!localStorage.getItem(LS_KEY)) {
    if (!items.length) { showLogin(); setStatus(navigator.onLine ? 'on' : 'off', navigator.onLine ? 'Online' : 'Offline'); return; }
  }
  if (!items.length) { setStatus('sync', 'Memuat…'); $('#stage').innerHTML = ''; }
  sync();
})();
</script>
</body>
</html>
